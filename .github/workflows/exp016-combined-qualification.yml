name: Exp016 combined-source qualification
on:
  push:
    branches: [work/exp016-combined-qualification-20261108]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exp016-combined-${{ github.ref }}
  cancel-in-progress: false
jobs:
  combined:
    name: Combined source and fresh replay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test combined-source generator
        run: python3 -m unittest discover -s NDEA_Evolve_offruntime/exp016/verification_combined -p 'test_*.py' -v
      - name: Bind successful baseline and generate exact combined source
        run: python3 NDEA_Evolve_offruntime/exp016/verification_combined/combined_check.py prepare --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/exp016-combined"
      - name: Provision unchanged compiler and external libraries
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: ${{ runner.temp }}/exp016-combined/deps
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Compile without project objects, audit catalog, and replay
        run: python3 NDEA_Evolve_offruntime/exp016/verification_combined/combined_check.py run --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/exp016-combined"
      - name: Preserve combined evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exp016-combined-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/exp016-combined/*.json
            ${{ runner.temp }}/exp016-combined/*.log
            ${{ runner.temp }}/exp016-combined/sources/
            ${{ runner.temp }}/exp016-combined/combined-olean/
          if-no-files-found: error
          retention-days: 90
